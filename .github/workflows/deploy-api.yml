name: Deploy API to Heroku

on:
  push:
    branches:
      - main
    paths:
      - 'src/api/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login no Heroku Container Registry
        run: echo "${{ secrets.HEROKU_API_KEY }}" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build e push Docker image
        run: |
          docker build -t registry.heroku.com/${{ secrets.HEROKU_API_NAME }}/web ./src/api
          docker push registry.heroku.com/${{ secrets.HEROKU_API_NAME }}/web

      - name: Release app
        run: heroku container:release web --app ${{ secrets.HEROKU_API_NAME }}

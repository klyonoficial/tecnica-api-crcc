name: Deploy Client to Heroku

on:
  push:
    branches:
      - main
    paths:
      - 'src/client/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login no Heroku Container Registry
        run: echo "${{ secrets.HEROKU_API_KEY }}" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build e push Docker image Vue.js
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --load -t registry.heroku.com/${{ secrets.HEROKU_CLIENT_NAME }}/web ./src/api
          docker push registry.heroku.com/${{ secrets.HEROKU_CLIENT_NAME }}/web

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh
          
      - name: Release app
        run: heroku container:release web --app ${{ secrets.HEROKU_CLIENT_NAME }}

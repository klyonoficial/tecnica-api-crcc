server {
  listen ${PORT};

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location /config.js {
    default_type application/javascript;
    return 200 "window.VITE_API_URL='${VITE_API_URL}';";
  }

  error_page 500 502 503 504 /index.html;
}

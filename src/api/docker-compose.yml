services:
  tecnica:
    image: ${DOCKER_REGISTRY-}tecnica
    build:
      context: .
      dockerfile: Tecnica/Dockerfile
    container_name: tecnica-api
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Local
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      PORT: "5000"
      ConnectionStrings__DefaultConnection: "Server=db;Database=tecnica-crcc-local;User=tecnica;Password=123456;"
    depends_on:
      - db

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: tecnica-client
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    depends_on:
      - tecnica

  db:
    image: mariadb:10.5.29
    container_name: tecnica-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tecnica-crcc-local
      MYSQL_USER: tecnica
      MYSQL_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
